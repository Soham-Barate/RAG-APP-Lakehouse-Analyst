# ============================================================
# Docker Compose — Full E-commerce RAG Stack
# ============================================================

services:
  # ----- PostgreSQL + pgvector -----
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    environment:
      POSTGRES_DB: rag_ecommerce
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: change-me-in-production
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ----- Redis -----
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ----- FastAPI Backend -----
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-backend
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/api/v1/ready'); exit(0 if r.status_code == 200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  # ----- Streamlit Frontend -----
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-frontend
    command: >
      python -m streamlit run frontend/app.py
      --server.port 8501
      --server.address 0.0.0.0
      --server.headless true
    environment:
      BACKEND_URL: http://backend:8000
      API_KEY: ${API_KEY:-dev-key-1}
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
