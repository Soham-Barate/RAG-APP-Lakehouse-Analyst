name: CI

on:
  push:
    branches: [main, "improve/*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Style Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Linter
        run: ruff check backend ingestion config evaluation tests

  test:
    name: Automated Unit & Regression Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run Pytest with Coverage
        run: |
          pytest -p no:cacheprovider --cov=backend --cov=ingestion --cov-report=term-missing tests/

  security:
    name: Security Vulnerability & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Security Tools
        run: pip install bandit

      - name: Run Bandit AST Security Scan
        run: bandit -r backend ingestion -ll -x tests,evaluation --skip B101,B104

